<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #137333;
      --primary-hover: #0d5324;
      --primary-light: #e6f4ea;
      --surface: #ffffff;
      --background: #f8f9fa;
      --text: #202124;
      --text-secondary: #5f6368;
      --border: #dadce0;
      --danger: #d93025;
      --warning: #f29900;
      --shadow-sm: 0 1px 2px 0 rgba(60,64,67,0.1), 0 1px 3px 1px rgba(60,64,67,0.06);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      color: var(--text);
      background-color: var(--background);
      padding: 16px;
      line-height: 1.5;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 16px;
      color: var(--primary);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge-online {
      background: var(--primary-light);
      color: var(--primary);
    }

    .badge-offline {
      background: #fce8e6;
      color: var(--danger);
    }

    .alert-banner {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius);
      margin-bottom: 12px;
      font-size: 12px;
      line-height: 1.4;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .alert-success {
      background: #e6f4ea;
      border: 1px solid #ceead6;
      color: #137333;
    }

    .alert-error {
      background: #fce8e6;
      border: 1px solid #fad2cf;
      color: #c5221f;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 10px;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group {
      margin-bottom: 10px;
    }

    label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select {
      width: 100%;
      padding: 8px 10px;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #ffffff;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s ease;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 9px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-upload-prominent {
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 1px 3px rgba(19,115,51,0.25);
    }

    .btn-secondary {
      background-color: #ffffff;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: #f1f3f4;
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      box-shadow: none;
    }

    .receipt-box {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      margin-top: 6px;
    }

    .amount-pill {
      font-weight: 700;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 12px;
      white-space: nowrap;
    }

    .amount-outflow {
      background: #f1f3f4;
      color: #202124;
    }

    .amount-inflow {
      background: #e6f4ea;
      color: #137333;
    }

    .meta-tag {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      background: #f1f3f4;
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      word-break: break-all;
    }

    .console {
      background: #202124;
      color: #e8eaed;
      font-family: 'Roboto Mono', monospace;
      font-size: 11px;
      border-radius: 6px;
      padding: 8px 10px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.4;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14H6v-2h6v2zm4-4H6v-2h10v2zm0-4H6V7h10v2z"/>
      </svg>
      YNAB Sync
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <span id="conn-badge" class="badge badge-offline">Checking...</span>
      <button id="btn-logout" class="btn btn-secondary hidden" style="width:auto; padding:2px 8px; font-size:11px; color:var(--danger); border-color:#fad2cf;" onclick="logoutYnab()">Log Out</button>
    </div>
  </div>

  <!-- Notification / Feedback Banner -->
  <div id="alert-banner" class="alert-banner alert-success hidden">
    <div id="alert-icon" style="font-size:16px; line-height:1; font-weight:700;">✓</div>
    <div style="flex:1;">
      <div id="alert-title" style="font-weight:600; font-size:12px;"></div>
      <div id="alert-message" style="font-size:11px; opacity:0.9;"></div>
    </div>
    <button onclick="dismissAlert()" style="background:none; border:none; cursor:pointer; font-size:16px; color:inherit; opacity:0.6; line-height:1; padding:0 2px;">×</button>
  </div>

  <!-- State 1: Authentication Card -->
  <div id="card-token" class="card hidden">
    <div class="card-title">Connect to YNAB</div>
    <p style="font-size:12px; color:var(--text-secondary); margin-bottom:12px;">
      Enter your YNAB Personal Access Token to connect your budgets.
    </p>
    <div class="form-group">
      <label>Personal Access Token</label>
      <input type="password" id="pat-token-input" placeholder="Paste YNAB Access Token">
    </div>
    <div style="margin-bottom:14px;">
      <a href="https://app.ynab.com/settings/developer" target="_blank" style="font-size:11px; color:var(--primary); text-decoration:none; font-weight:500;">
        → Generate token in YNAB Developer Settings
      </a>
    </div>
    <button id="btn-save-token" class="btn btn-primary" onclick="savePersonalAccessToken()">Connect to YNAB</button>
  </div>

  <!-- State 2: Destination & Context Card -->
  <div id="card-account" class="card hidden">
    <div class="card-title">
      <span>Account Destination</span>
      <div style="display:flex; gap:4px;">
        <button id="btn-change-account" class="btn btn-secondary" style="width:auto; padding:2px 8px; font-size:11px;" onclick="showAccountPicker()">Change</button>
        <button id="btn-unlink-account" class="btn btn-secondary hidden" style="width:auto; padding:2px 8px; font-size:11px;" onclick="unlinkAccount()">Unlink</button>
      </div>
    </div>

    <!-- Read-only Display -->
    <div id="account-display">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
        <div style="font-size:11px; color:var(--text-secondary);">Sheet: <b id="active-sheet-name" style="color:var(--text);"></b></div>
        <button onclick="refreshState()" title="Refresh Sheet & Account Info" style="background:none; border:none; color:var(--text-secondary); cursor:pointer; font-size:13px; line-height:1; padding:0 2px;">↻</button>
      </div>
      <div style="font-size:11px; color:var(--text-secondary); margin-bottom:4px;">YNAB Budget: <b id="linked-budget-name" style="color:var(--text);">None</b></div>
      <div style="font-size:11px; color:var(--text-secondary); margin-bottom:12px;">YNAB Account: <b id="linked-account-name" style="color:var(--text);">None</b></div>

      <!-- Most Recent YNAB Transaction Anchor -->
      <div id="latest-tx-container">
        <label>Most Recent YNAB Record</label>
        <div id="latest-tx-box" class="receipt-box">
          <span style="color:var(--text-secondary); font-size:11px;">Loading...</span>
        </div>
      </div>
    </div>

    <!-- Account Picker Form -->
    <div id="account-picker" class="hidden">
      <div class="form-group">
        <label>Select Budget</label>
        <select id="select-budget" onchange="onBudgetChange()">
          <option value="">Loading budgets...</option>
        </select>
      </div>
      <div class="form-group">
        <label>Select Account</label>
        <select id="select-account">
          <option value="">Choose a budget first</option>
        </select>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-primary" onclick="saveAccountLink()">Link to Sheet</button>
        <button class="btn btn-secondary" onclick="hideAccountPicker()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- State 3: Upload Action Card -->
  <div id="card-sync" class="card hidden">
    <div class="card-title">Sync Transactions</div>
    <div id="sync-status-hint" style="font-size:12px; color:var(--text-secondary); margin-bottom:10px;">
      Checking transactions in sheet...
    </div>

    <!-- Prominent Action Button -->
    <div>
      <button id="btn-upload" class="btn btn-primary btn-upload-prominent" onclick="runUpload()">
        Upload Transactions
      </button>
    </div>
  </div>

  <!-- Collapsible Technical Log -->
  <details id="details-log" style="margin-top:10px; font-size:11px; color:var(--text-secondary);">
    <summary style="cursor:pointer; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; user-select:none; margin-bottom:4px;">
      Activity Log
    </summary>
    <div id="console" class="console" style="height:80px;">Ready.</div>
  </details>

  <script>
    var globalBudgetsData = [];
    var currentSheetName = '';
    var isCheckingTab = false;

    function log(msg) {
      var box = document.getElementById('console');
      if (!box) return;
      var time = new Date().toLocaleTimeString();
      box.textContent = '[' + time + '] ' + msg + '\n' + box.textContent;
    }

    function showAlert(type, title, message) {
      var banner = document.getElementById('alert-banner');
      var icon = document.getElementById('alert-icon');
      var t = document.getElementById('alert-title');
      var m = document.getElementById('alert-message');

      banner.className = 'alert-banner alert-' + type;
      icon.textContent = (type === 'success') ? '✓' : (type === 'error' ? '⚠' : 'ℹ');
      t.textContent = title;
      m.textContent = message || '';
      banner.classList.remove('hidden');
    }

    function dismissAlert() {
      document.getElementById('alert-banner').classList.add('hidden');
    }

    function refreshState() {
      google.script.run
        .withSuccessHandler(renderState)
        .withFailureHandler(function(err) {
          log('Error: ' + err.message);
          showAlert('error', 'Sync Error', err.message);
        })
        .apiGetState();
    }

    function renderState(state) {
      var badge = document.getElementById('conn-badge');
      var cardToken = document.getElementById('card-token');
      var cardAccount = document.getElementById('card-account');
      var cardSync = document.getElementById('card-sync');
      var btnLogout = document.getElementById('btn-logout');

      currentSheetName = state.activeSheetName;
      document.getElementById('active-sheet-name').textContent = state.activeSheetName;

      if (btnLogout) {
        if (state.isAuthorized) {
          btnLogout.classList.remove('hidden');
        } else {
          btnLogout.classList.add('hidden');
        }
      }

      if (!state.isAuthorized) {
        badge.className = 'badge badge-offline';
        badge.textContent = 'Disconnected';
        cardToken.classList.remove('hidden');
        cardAccount.classList.add('hidden');
        cardSync.classList.add('hidden');
        return;
      } else {
        badge.className = 'badge badge-online';
        badge.textContent = 'Connected';
        cardToken.classList.add('hidden');
        cardAccount.classList.remove('hidden');
        cardSync.classList.remove('hidden');
      }

      // Render Account Association
      var btnUnlink = document.getElementById('btn-unlink-account');
      var btnUpload = document.getElementById('btn-upload');
      var statusHint = document.getElementById('sync-status-hint');

      if (state.linkedAccount) {
        var budgetEl = document.getElementById('linked-budget-name');
        var accountEl = document.getElementById('linked-account-name');
        if (budgetEl) budgetEl.textContent = state.linkedAccount.budgetName || 'None';
        if (accountEl) accountEl.textContent = state.linkedAccount.accountName || 'None';
        if (btnUnlink) btnUnlink.classList.remove('hidden');
        hideAccountPicker();
        loadLatestTransaction();

        // Upload button is always active without count
        btnUpload.disabled = false;
        btnUpload.textContent = 'Upload Transactions';

        var stats = state.stats || { total: 0, pending: 0, uploaded: 0 };
        if (stats.total === 0) {
          statusHint.textContent = 'No transactions found in this sheet.';
        } else if (stats.pending === 0) {
          statusHint.textContent = 'All ' + stats.total + ' transactions in this sheet synced with YNAB.';
        } else {
          statusHint.textContent = stats.total + ' transaction' + (stats.total === 1 ? '' : 's') + ' in sheet (' + stats.pending + ' pending).';
        }
      } else {
        var budgetEl = document.getElementById('linked-budget-name');
        var accountEl = document.getElementById('linked-account-name');
        if (budgetEl) budgetEl.textContent = 'None';
        if (accountEl) accountEl.textContent = 'None';
        btnUpload.disabled = false;
        btnUpload.textContent = 'Upload Transactions';
        statusHint.textContent = 'Link this sheet to an account to start syncing.';
        if (btnUnlink) btnUnlink.classList.add('hidden');
        if (document.getElementById('account-picker').classList.contains('hidden')) {
          showAccountPicker();
        }
        var txBox = document.getElementById('latest-tx-box');
        if (txBox) {
          txBox.innerHTML = '<span style="color:var(--text-secondary); font-size:11px;">Link an account to view recent transactions</span>';
        }
      }
    }

    function savePersonalAccessToken() {
      var tokenInput = document.getElementById('pat-token-input');
      var token = tokenInput.value.trim();
      if (!token) {
        showAlert('error', 'Token Required', 'Please enter your YNAB Personal Access Token.');
        return;
      }
      var btn = document.getElementById('btn-save-token');
      btn.disabled = true;
      btn.textContent = 'Validating Token...';
      log('Validating Personal Access Token with YNAB...');
      google.script.run
        .withSuccessHandler(function() {
          btn.disabled = false;
          btn.textContent = 'Connect to YNAB';
          tokenInput.value = '';
          log('Successfully connected to YNAB!');
          showAlert('success', 'Connected', 'Successfully authenticated with YNAB.');
          refreshState();
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.textContent = 'Connect to YNAB';
          log('Error: ' + err.message);
          showAlert('error', 'Connection Failed', err.message);
        })
        .apiSaveToken(token);
    }

    function showAccountPicker() {
      document.getElementById('account-picker').classList.remove('hidden');
      document.getElementById('account-display').classList.add('hidden');
      document.getElementById('btn-change-account').classList.add('hidden');
      var btnUnlink = document.getElementById('btn-unlink-account');
      if (btnUnlink) btnUnlink.classList.add('hidden');

      log('Fetching YNAB budgets and accounts...');
      google.script.run
        .withSuccessHandler(function(budgets) {
          globalBudgetsData = budgets;
          var bSelect = document.getElementById('select-budget');
          bSelect.innerHTML = '<option value="">-- Choose Budget --</option>';
          for (var i = 0; i < budgets.length; i++) {
            var opt = document.createElement('option');
            opt.value = budgets[i].id;
            opt.textContent = budgets[i].name;
            bSelect.appendChild(opt);
          }
          onBudgetChange();
        })
        .withFailureHandler(function(err) {
          log('Error fetching budgets: ' + err.message);
        })
        .apiGetBudgetsAndAccounts();
    }

    function hideAccountPicker() {
      document.getElementById('account-picker').classList.add('hidden');
      document.getElementById('account-display').classList.remove('hidden');
      document.getElementById('btn-change-account').classList.remove('hidden');
      var btnUnlink = document.getElementById('btn-unlink-account');
      var accountText = document.getElementById('linked-account-name').textContent;
      if (btnUnlink && accountText && accountText !== 'None' && !accountText.startsWith('⚠️')) {
        btnUnlink.classList.remove('hidden');
      } else if (btnUnlink) {
        btnUnlink.classList.add('hidden');
      }
    }

    function unlinkAccount() {
      if (!confirm('Unlink this sheet from YNAB?')) return;
      log('Unlinking sheet...');
      google.script.run
        .withSuccessHandler(function() {
          log('Sheet unlinked.');
          showAlert('success', 'Unlinked', 'This sheet has been unlinked.');
          refreshState();
        })
        .withFailureHandler(function(err) {
          log('Error: ' + err.message);
          showAlert('error', 'Unlink Failed', err.message);
        })
        .apiUnlinkActiveSheet();
    }

    function onBudgetChange() {
      var budgetId = document.getElementById('select-budget').value;
      var aSelect = document.getElementById('select-account');
      aSelect.innerHTML = '<option value="">-- Choose Account --</option>';

      if (!budgetId) return;
      var selectedBudget = globalBudgetsData.find(function(b) { return b.id === budgetId; });
      if (!selectedBudget) return;

      var accounts = selectedBudget.accounts || [];
      for (var i = 0; i < accounts.length; i++) {
        var aOpt = document.createElement('option');
        aOpt.value = accounts[i].id;
        aOpt.textContent = accounts[i].name + ' (' + accounts[i].type + ')';
        aSelect.appendChild(aOpt);
      }
    }

    function saveAccountLink() {
      var bSelect = document.getElementById('select-budget');
      var aSelect = document.getElementById('select-account');

      var budgetId = bSelect.value;
      var budgetName = bSelect.options[bSelect.selectedIndex].text;
      var accountId = aSelect.value;
      var accountName = aSelect.options[aSelect.selectedIndex].text;

      if (!budgetId || !accountId) {
        showAlert('error', 'Selection Incomplete', 'Please select both a Budget and an Account.');
        return;
      }

      log('Linking sheet to ' + budgetName + ' > ' + accountName + '...');
      google.script.run
        .withSuccessHandler(function() {
          log('Sheet successfully linked.');
          showAlert('success', 'Account Linked', 'Sheet is now linked to ' + accountName + '.');
          hideAccountPicker();
          refreshState();
        })
        .withFailureHandler(function(err) {
          log('Link error: ' + err.message);
          showAlert('error', 'Link Error', err.message);
        })
        .apiLinkActiveSheet(budgetId, budgetName, accountId, accountName);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function loadLatestTransaction() {
      var box = document.getElementById('latest-tx-box');
      if (!box) return;

      google.script.run
        .withSuccessHandler(function(tx) {
          if (!tx) {
            box.innerHTML = '<span style="color:var(--text-secondary); font-size:11px;">No transactions found in this account</span>';
            return;
          }
          var amtNum = (tx.amount / 1000).toFixed(2);
          var isOutflow = tx.amount < 0;
          var pillClass = isOutflow ? 'amount-outflow' : 'amount-inflow';
          var amtDisplay = (tx.amount > 0 ? '+' : '') + amtNum;

          box.innerHTML =
            '<div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">' +
              '<div style="overflow:hidden; max-width:180px;">' +
                '<div style="font-weight:600; font-size:12px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="' + escapeHtml(tx.payeeName) + '">' + escapeHtml(tx.payeeName) + '</div>' +
                '<div style="font-size:11px; color:var(--text-secondary); margin-top:1px;">' +
                  '📅 ' + tx.date + (tx.memo ? ' · ' + escapeHtml(tx.memo) : '') +
                '</div>' +
              '</div>' +
              '<div class="amount-pill ' + pillClass + '">' + amtDisplay + '</div>' +
            '</div>';
        })
        .withFailureHandler(function(err) {
          box.innerHTML = '<span style="color:var(--danger); font-size:11px;">Could not load transaction</span>';
        })
        .apiGetLatestTransaction();
    }

    function runUpload() {
      var btn = document.getElementById('btn-upload');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Uploading...';
      log('Uploading transactions to YNAB...');

      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false;
          btn.textContent = 'Upload Transactions';
          var dupMsg = res.duplicateCount ? ' (' + res.duplicateCount + ' duplicates skipped)' : '';
          var successMsg = res.uploadedCount + ' transaction' + (res.uploadedCount === 1 ? '' : 's') + ' uploaded to YNAB' + dupMsg + '.';
          
          log('Upload complete: ' + successMsg);
          showAlert('success', 'Upload Complete', successMsg);
          loadLatestTransaction();
          refreshState();
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.textContent = 'Upload Transactions';
          log('Upload error: ' + err.message);
          showAlert('error', 'Upload Failed', err.message);
        })
        .apiUploadTransactions();
    }

    function logoutYnab() {
      if (!confirm('Are you sure you want to disconnect from YNAB? You will need to re-enter your Personal Access Token before syncing transactions.')) return;
      var btnLogout = document.getElementById('btn-logout');
      if (btnLogout) btnLogout.disabled = true;
      globalBudgetsData = [];
      log('Disconnecting from YNAB...');
      google.script.run
        .withSuccessHandler(function() {
          if (btnLogout) btnLogout.disabled = false;
          log('Successfully disconnected from YNAB.');
          showAlert('info', 'Disconnected', 'You have been disconnected from YNAB.');
          refreshState();
        })
        .withFailureHandler(function(err) {
          if (btnLogout) btnLogout.disabled = false;
          log('Disconnect error: ' + err.message);
          showAlert('error', 'Disconnect Error', err.message);
        })
        .apiDisconnect();
    }

    function checkActiveTab() {
      if (document.hidden || isCheckingTab || !currentSheetName) return;
      isCheckingTab = true;
      google.script.run
        .withSuccessHandler(function(res) {
          isCheckingTab = false;
          if (res && res.changed) {
            log('Switched to sheet: ' + res.activeSheetName);
            renderState({
              isAuthorized: true,
              activeSheetName: res.activeSheetName,
              linkedAccount: res.linkedAccount,
              stats: res.stats
            });
          }
        })
        .withFailureHandler(function() {
          isCheckingTab = false;
        })
        .apiCheckActiveSheet(currentSheetName);
    }

    // Fast, lightweight 800ms heartbeat
    setInterval(checkActiveTab, 800);

    // Also trigger immediately when user focuses or moves cursor over the sidebar
    window.addEventListener('focus', checkActiveTab);
    document.body.addEventListener('mouseenter', checkActiveTab);

    // Initialize on load
    refreshState();
  </script>
</body>
</html>
